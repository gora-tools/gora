[project]
name = "gora"
# A package label, never bumped: the version lives in tags and the manifest (L9).
version = "0.0.0"
description = "Deterministic GitOps Release Engine"
requires-python = ">=3.12"
license = "Apache-2.0"
# What the distribution carries. hatchling keeps what the patterns match and says nothing
# of a file that is missing; `make image-smoke` checks both are in the release image.
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "zrjes" }]
classifiers = ["License :: OSI Approved :: Apache Software License"]

dependencies = [
    "typer>=0.27.3",
    "rich>=15.0.0",
    "ruamel.yaml>=0.19.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.143.3",
    "uvicorn[standard]>=0.54.0",
]
slack = [
    "slack-bolt>=1.30.0",
]

# Development tools, split by what reads them (ADR-021 section 4): `test` and `check`, neither
# installed by default or in the release image. `test` runs the suite: the behaviour
# checks, on every platform. `check` reads source text: the source checks, once per
# commit. mypy reads the tests too, so `check` includes `test`.
[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0",
]
check = [
    { include-group = "test" },
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.26.0.20261006",
    "shellcheck-py>=0.10",
]
# The build backend, one exact version locked with hashes like every other package: the
# release image builds the project with it, without build isolation, and then removes it
# (deployments/docker/Dockerfile; TESTING rule 3).
build = [
    "hatchling==1.32.4",
]

[project.scripts]
gora = "gora.transport.cli.commands:app"

[build-system]
# A floor, where a developer builds; the release image builds with the exact version of the
# group `build` above, which this floor must admit (TESTING rule 3). 1.27.0: license-files as
# a list of patterns (1.26.0) and core metadata 2.4 as the default, which writes
# License-Expression and License-File.
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gora"]

[tool.uv]
# A floor, where a developer works: the lowest uv proven to run this project (make
# verify-export, 2026-10-03), and the first uv that reads this setting at all. The exact uv,
# where a result is produced, is the uv stage of deployments/docker/Dockerfile. The floor
# rises only when the project needs a newer uv feature or lock format, never with a pin
# bump (TESTING rule 3).
required-version = ">=0.5.21"
# Groups are installed only when a target names one (Makefile: sync, sync-test).
default-groups = []

[tool.ruff]
target-version = "py312"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"src/gora/domain/**/*.py" = ["TCH001", "TCH003"]  # Pydantic models need runtime imports, not TYPE_CHECKING

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]
# Every test has a timeout (TESTING rule 8), checked by tests/conftest.py. Over 5x the
# slowest test under linux/amd64 emulation. signal: it ended hangs the thread method could not.
timeout = 120
timeout_method = "signal"
