[project]
name = "gora"
# A package label, never bumped: the version lives in tags and the manifest (L9).
version = "0.0.0"
description = "Deterministic GitOps Release Engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "zrjes" }]

dependencies = [
    "typer>=0.27.2",
    "rich>=15.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
]
slack = [
    "slack-bolt>=1.30.0",
]

# Development tools, split by what reads them (ADR-021 section 4). Neither group is
# installed by default or in the release image. `test` runs the suite: the behaviour
# checks, on every platform. `check` reads source text: the source checks, once per
# commit. mypy reads the tests too, so `check` includes `test`.
[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "jsonschema>=4.26.0",
]
check = [
    { include-group = "test" },
    "ruff>=0.16.10",
    "mypy>=2.4.0",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.26.0",
    "shellcheck-py>=0.10",
]

[project.scripts]
gora = "gora.transport.cli.commands:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gora"]

[tool.uv]
# A floor, where a developer works: the lowest uv proven to run this project (make
# verify-export, 2026-10-03), and the first uv that reads this setting at all. The exact uv,
# where a result is produced, is the uv stage of deployments/docker/Dockerfile. The floor
# rises only when the project needs a newer uv feature or lock format, never with a pin
# bump (TESTING rule 3).
required-version = ">=0.5.21"
# Groups are installed only when a target names one (Makefile: sync, sync-test).
default-groups = []

[tool.ruff]
target-version = "py312"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"src/gora/transport/cli/*.py" = ["B008"]  # typer.Option() in defaults is standard Typer pattern
"src/gora/domain/**/*.py" = ["TCH001", "TCH003"]  # Pydantic models need runtime imports, not TYPE_CHECKING

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]
# Every test has a timeout (TESTING rule 8), checked by tests/conftest.py. Over 5x the
# slowest test under linux/amd64 emulation. signal: it ended hangs the thread method could not.
timeout = 120
timeout_method = "signal"
