# Gate-defining file (ADR-0016 rule 7). One platform of the release image, built on its own
# native runner, its git tests run on the image's own git first (the Dockerfile's stage
# test, never pushed), pushed by digest without a tag as the stage runtime, and smoke-tested
# from that pushed digest on the same runner (ADR-021 sections 2 and 4), then saved once as an
# OCI layout and scanned with GORA's pinned scanner, offline, from that layout (ADR-011,
# amendment 2026-11-07; `make image-scan`). CI runs these steps on every pull request, pushing
# to a registry on the runner; the release workflow runs the same steps for a candidate,
# pushing to GHCR, so the scan runs before anything is assembled or published. The rehearsal is
# the release path, not a copy of it.
#
# The image carries the commit it is built from, never a version (L9): as GORA_REVISION in
# its environment, and as org.opencontainers.image.revision, the image's label and the
# platform manifest's annotation.
name: Build the release image for this runner
description: >-
  Build the release image for the runner's own platform from the checked-out tracked files,
  no layer cache, every base pulled by digest; run the product's git tests on the image's own
  git; push the image by digest; record and smoke it; save the pushed image as an OCI layout
  and scan that layout with the pinned scanner, offline.

inputs:
  image:
    description: Repository to push to, without a tag
    required: true
  platform:
    description: This runner's own platform, linux/amd64 or linux/arm64
    required: true
  record:
    description: Path of the build record to write (scripts/gate/build-record.sh)
    required: true
  layout:
    description: >-
      Directory to write the pushed image's OCI layout to: every manifest as it is pushed, so
      that its digests do not change on the way. The scan reads it, and CI's assemble job pushes
      it on.
    required: true

outputs:
  digest:
    description: What was pushed, an index of the platform image and its provenance
    value: ${{ steps.build.outputs.digest }}
  manifest:
    description: The platform image manifest inside it, the digest that was smoke-tested
    value: ${{ steps.record.outputs.manifest }}

runs:
  using: composite
  steps:
    - name: Check the runner and the build context
      id: context
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
      run: |
        native=$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')
        if [ "$native" != "$PLATFORM" ]; then
          echo "::error::this runner is $native, not $PLATFORM: no build runs under emulation (ADR-021)"
          exit 1
        fi
        # The context is the checkout: tracked files only, nothing generated or ignored.
        extra=$(git status --porcelain --ignored)
        if [ -n "$extra" ]; then
          echo "::error::the build context holds files git does not track:"
          printf '%s\n' "$extra"
          exit 1
        fi
        # The commit the image is built from (L9).
        echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Read the pinned builder image
      id: pins
      shell: bash
      run: |
        buildkit=$(scripts/gate/image.sh buildkit)
        echo "buildkit=$buildkit" >> "$GITHUB_OUTPUT"

    - name: Set up Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        version: v0.37.2
        cache-binary: false
        # host network: the builder reaches a registry on the runner's loopback.
        driver-opts: |
          image=${{ steps.pins.outputs.buildkit }}
          network=host

    # The product's git tests on the release image's own git (the Dockerfile's stage test): built
    # and run here, on this platform, before anything is pushed. The stage runs them while it
    # builds, so a failing test fails this step; nothing is exported and nothing is pushed.
    - name: Test the product on the release image's git
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: deployments/docker/Dockerfile
        target: test
        platforms: ${{ inputs.platform }}
        pull: true
        no-cache: true
        provenance: false
        sbom: false
        build-args: GORA_REVISION=${{ steps.context.outputs.revision }}
        outputs: type=cacheonly

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: deployments/docker/Dockerfile
        target: runtime
        platforms: ${{ inputs.platform }}
        pull: true
        no-cache: true
        provenance: mode=max
        sbom: false
        build-args: GORA_REVISION=${{ steps.context.outputs.revision }}
        annotations: manifest:org.opencontainers.image.revision=${{ steps.context.outputs.revision }}
        outputs: type=image,name=${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true

    - name: Record the platform manifest
      id: record
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ steps.build.outputs.digest }}
        PLATFORM: ${{ inputs.platform }}
        RECORD: ${{ inputs.record }}
      run: |
        mkdir -p "$(dirname "$RECORD")"
        scripts/gate/build-record.sh "$IMAGE" "$DIGEST" "$PLATFORM" > "$RECORD"
        cat "$RECORD"
        grep '^manifest=' "$RECORD" >> "$GITHUB_OUTPUT"

    - name: Smoke the pushed digest on this runner
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ steps.build.outputs.digest }}
        PLATFORM: ${{ inputs.platform }}
        REVISION: ${{ steps.context.outputs.revision }}
      run: make image-smoke IMAGE="$IMAGE@$DIGEST" PLATFORM="$PLATFORM" REVISION="$REVISION"

    # The pushed image, byte for byte, made once: an OCI layout keeps every manifest as it is, so
    # its digests do not change on the way. The scan reads it, and so does CI's assemble job.
    - name: Save the pushed image as an OCI layout
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ steps.build.outputs.digest }}
        LAYOUT: ${{ inputs.layout }}
      run: |
        scripts/gate/crane.sh "$RUNNER_TEMP/bin"
        "$RUNNER_TEMP/bin/crane" pull --format=oci "$IMAGE@$DIGEST" "$LAYOUT"

    # The pinned scanner (the stage scanner of gate-images.Dockerfile), offline and from the
    # layout: a vulnerability with a fix, high or critical, fails the run. Before anything is
    # assembled or published.
    - name: Scan the pushed image
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        LAYOUT: ${{ inputs.layout }}
      run: make image-scan SCAN_LAYOUT="$LAYOUT" PLATFORM="$PLATFORM"
