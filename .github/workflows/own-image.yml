name: Own image

# Gate-defining file (ADR-0016 rule 7). The one workflow that builds GORA's own images and
# pushes them to GHCR by digest (ADR-011, amendments 2026-11-05 and 2026-11-07): the base image,
# deployments/docker/base.Dockerfile, and the scanner image, deployments/docker/scanner.Dockerfile.
# What differs between them is an input: the Dockerfile, the GHCR repository and the kind of
# image, which selects the smoke that runs. The two callers, base.yml and scanner.yml, are thin:
# workflow_dispatch alone, a concurrency group of their own, the permissions these jobs need,
# and one call. A person runs a caller, from main and from nowhere else, when its image must
# change. Nothing starts it, and it is no check of any pull request.
#
# Built as the release image is (ADR-021): one image for each platform on its native runner,
# with no layer cache, every base pulled by digest, BuildKit provenance (mode=max). The
# platforms are pushed to a registry on the runner and smoked from there
# (scripts/gate/own-image-smoke.sh); only then does one job move the exact images, unchanged, to
# GHCR by digest and assemble the index. Nothing is pushed by tag but the index, once, under a
# name of this run that no one reads (a registry keeps an index only under a name); the digest
# is the identity.
#
# Only these images' builds reach snapshot.debian.org, Docker Hub and Anchore's database
# service for the release path. The jobs hold what they need and no more: the build jobs push to
# a registry on the runner and hold no write permission; the publish job alone holds
# packages: write. A called workflow cannot hold more than its caller grants, so the callers
# grant the same ceiling to their one job.

on:
  workflow_call:
    inputs:
      dockerfile:
        description: The Dockerfile to build, under deployments/docker/.
        type: string
        required: true
      image:
        description: The GHCR repository the index is pushed to.
        type: string
        required: true
      kind:
        description: The kind of image, base or scanner; it selects the smoke that runs.
        type: string
        required: true

# Nothing by default; every job asks for what it needs.
permissions: {}

env:
  IMAGE: ${{ inputs.image }}
  # Where each platform is built and smoked, before anything reaches GHCR.
  REHEARSAL: localhost:5000/gora-${{ inputs.kind }}
  KIND: ${{ inputs.kind }}

jobs:
  # The first step of the run. It checks out nothing and holds no permission: it reads the ref
  # the run was started on, which is the caller's, and nothing else. tests/unit/test_build_pins.py
  # runs it from this file.
  guard:
    name: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse any ref but main
        id: guard
        shell: bash
        run: |
          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "::error::${GITHUB_REF:-(no ref)} is not refs/heads/main." \
              "GORA's own images are built from main and from nowhere else."
            exit 1
          fi
          echo "building ${KIND} image from ${GITHUB_REF}"

  build:
    name: build (${{ matrix.platform }})
    needs: guard
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            slug: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            slug: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start a registry on this runner
        shell: bash
        run: scripts/gate/registry.sh

      - name: Check the runner and the build context
        id: context
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          native=$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')
          if [ "$native" != "$PLATFORM" ]; then
            echo "::error::this runner is $native, not $PLATFORM: no build runs under emulation (ADR-021)"
            exit 1
          fi
          # The context is the checkout: tracked files only, nothing generated or ignored.
          extra=$(git status --porcelain --ignored)
          if [ -n "$extra" ]; then
            echo "::error::the build context holds files git does not track:"
            printf '%s\n' "$extra"
            exit 1
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read the pinned builder image
        id: pins
        shell: bash
        run: echo "buildkit=$(scripts/gate/image.sh buildkit)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.2
          cache-binary: false
          # host network: the builder reaches the registry on the runner's loopback.
          driver-opts: |
            image=${{ steps.pins.outputs.buildkit }}
            network=host

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          pull: true
          no-cache: true
          provenance: mode=max
          sbom: false
          annotations: manifest:org.opencontainers.image.revision=${{ steps.context.outputs.revision }}
          outputs: type=image,name=${{ env.REHEARSAL }},push-by-digest=true,name-canonical=true,push=true

      - name: Record the platform manifest
        id: record
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          RECORD: ${{ runner.temp }}/image/record
        run: |
          mkdir -p "$(dirname "$RECORD")"
          scripts/gate/build-record.sh "$REHEARSAL" "$DIGEST" "$PLATFORM" > "$RECORD"
          cat "$RECORD"
          grep '^manifest=' "$RECORD" >> "$GITHUB_OUTPUT"

      # Before anything reaches GHCR: the image runs, offline and read-only, and the checks of
      # its kind hold (scripts/gate/own-image-smoke.sh).
      - name: Smoke the image on this runner
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: scripts/gate/own-image-smoke.sh "$KIND" "$REHEARSAL@$DIGEST" "$PLATFORM"

      # The pushed image, byte for byte, for the publish job: an OCI layout keeps every
      # manifest as it is, so its digests do not change on the way.
      - name: Save the image as an OCI layout
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          scripts/gate/crane.sh "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/crane" pull --format=oci "$REHEARSAL@$DIGEST" "$RUNNER_TEMP/image/layout"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.kind }}-${{ matrix.slug }}
          path: ${{ runner.temp }}/image
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push each platform by digest, and the index
    outputs:
      index: ${{ steps.assemble.outputs.index }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.kind }}-*
          path: ${{ runner.temp }}/images

      # The images that were smoked, unchanged: each must arrive as the digest its job built.
      # The reference names that digest: a push to the repository alone writes the tag latest
      # as well (measured with crane v0.22.1 against a registry), a push to a digest writes no
      # tag, so the only tag this workflow ever writes is the index's.
      - name: Push each platform image by digest, unchanged
        shell: bash
        run: |
          scripts/gate/crane.sh "$RUNNER_TEMP/bin"
          for dir in "$RUNNER_TEMP"/images/"$KIND"-*; do
            want=$(sed -n 's/^digest=//p' "$dir/record")
            got=$("$RUNNER_TEMP/bin/crane" push "$dir/layout" "$IMAGE@$want")
            echo "$(basename "$dir"): $got"
            if [ "$got" != "$IMAGE@$want" ]; then
              echo "::error::$(basename "$dir") arrived as $got, not as the $want its job built"
              exit 1
            fi
          done

      - name: Assemble the index
        id: assemble
        uses: ./.github/actions/assemble-index
        with:
          image: ${{ env.IMAGE }}
          # The one tag: a name for this run's index, which no one reads and which no later
          # run reuses. The digest is the identity.
          tag: run-${{ github.run_id }}-${{ github.run_attempt }}
          records: ${{ runner.temp }}/images/${{ inputs.kind }}-*/record

      - name: Emit the result
        shell: bash
        env:
          INDEX: ${{ steps.assemble.outputs.index }}
        run: |
          echo "the $KIND image: $IMAGE@$INDEX"
          {
            echo "## GORA $KIND image"
            echo ""
            echo "- image: \`$IMAGE@$INDEX\`"
            echo "- the index digest, which a gate or the release image names in its FROM: \`$INDEX\`"
            for record in "$RUNNER_TEMP"/images/"$KIND"-*/record; do
              echo "- \`$(sed -n 's/^platform=//p' "$record")\`: \`$(sed -n 's/^manifest=//p' "$record")\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
