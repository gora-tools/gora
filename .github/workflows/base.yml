name: Base image

# Gate-defining file (ADR-0016 rule 7). Builds GORA's own base image, deployments/docker/
# base.Dockerfile, and pushes it to ghcr.io/gora-tools/gora-base by digest (ADR-011,
# amendment 2026-11-05). A person runs it, from main and from nowhere else, when the base
# must change: a new Python digest, a new Debian snapshot, a new git. Nothing starts it, and
# it is no check of any pull request. The release image starts FROM the digest it prints.
#
# The build is the reusable workflow own-image.yml, which the scanner image's workflow calls
# too; this file is the call and what is the base's alone: its trigger, its concurrency group,
# and the permissions its one job passes down.

on:
  workflow_dispatch:

# Nothing by default; the job asks for what the called workflow's jobs need.
permissions: {}

# A second run waits for the first: two runs never move the registry at once.
concurrency:
  group: base-image
  cancel-in-progress: false

jobs:
  image:
    name: image
    permissions:
      contents: read
      packages: write # the ceiling of the called workflow: its publish job alone uses it
    uses: ./.github/workflows/own-image.yml
    with:
      dockerfile: deployments/docker/base.Dockerfile
      image: ghcr.io/gora-tools/gora-base
      smoke: base
