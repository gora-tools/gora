name: Release

# Gate-defining file (ADR-0016 rule 7). Builds, signs and publishes one GORA release
# candidate on a version tag: one OCI image index for linux/amd64 and linux/arm64, whose
# digest is the release identity (ADR-021, ADR-011 amendment 2026-10-03). Each platform is
# built on its own native runner, pushed by digest without a tag, and smoke-tested from that
# digest on the same runner; a final job assembles the index and tags it. The build and the
# assembly are the actions CI runs on every pull request (.github/actions/), so the
# rehearsal there is this path.
#
# Evidence, in the current model (ADR-011; the ADR-018 implementation replaces it next): a
# cosign keyless signature on the index and on each platform manifest, an SPDX SBOM attested
# to each platform manifest, BuildKit provenance for each platform. The verify job checks all
# of it for every platform manifest in the index.
#
# CI does NOT mutate the manifest — an operator/agent runs `gora cut-rc` + `gora promote`
# with the index digest this workflow emits and opens the pull request from an ordinary
# branch, until registration and the stage loop exist (ADR-022 section 4, ADR-023 section 8;
# release-model section 13). In the model the build runs on a commit to main and GORA
# registers it; the pushed tag is the operator's interim trigger (ADR-011).
#
# Only a release candidate is built (ADR-018 section 7): the first job refuses a tag whose
# version has no pre-release part, and every other job waits for it. A final version is a
# retag of the candidate's digest, never a build.

on:
  push:
    tags:
      - "v*"

# Nothing by default; every job asks for what it needs.
permissions: {}

env:
  IMAGE: ghcr.io/gora-tools/gora
  # Tools the actions below install, pinned. Updated by hand: Dependabot does not read
  # action inputs (TESTING rule 3).
  COSIGN_VERSION: v2.6.5
  SYFT_VERSION: v1.54.0
  # The signer pattern stays a regular expression until ADR-018 makes it one exact identity
  # of the reusable release workflow.
  SIGNER: ^https://github.com/gora-tools/gora/\.github/workflows/release\.yml@
  ISSUER: https://token.actions.githubusercontent.com

jobs:
  # The first step of the release. It checks out nothing and holds no permission: it reads
  # the pushed ref and nothing else. tests/unit/test_release_guard.py runs it from this file.
  guard:
    name: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse a tag whose version has no pre-release part
        id: guard
        shell: bash
        run: |
          # A GORA version (ADR-003) with a pre-release part: v<MAJOR.MINOR.PATCH>-<pre-release>,
          # no build metadata, at most 128 characters after the v, not ending in .lock.
          export LC_ALL=C
          number='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          candidate="^$number\.$number\.$number-$identifier(\.$identifier)*\$"
          ref=${GITHUB_REF:-}
          version=${ref#refs/tags/v}
          if [ "refs/tags/v$version" != "$ref" ] || [ "${#version}" -gt 128 ] ||
            ! [[ $version =~ $candidate ]] || [[ $version == *.lock ]]; then
            echo "::error::$ref is not a release candidate tag v<MAJOR.MINOR.PATCH>-<pre-release>." \
              "A final version is never built: it is a retag of the candidate's digest (ADR-018 section 7)."
            exit 1
          fi
          echo "release candidate $version"

  build:
    name: build (${{ matrix.platform }})
    needs: guard
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            slug: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            slug: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push by digest; the signature and the SBOM attestation
      id-token: write # cosign keyless (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, push by digest, smoke
        id: build
        uses: ./.github/actions/build-image
        with:
          image: ${{ env.IMAGE }}
          platform: ${{ matrix.platform }}
          record: ${{ runner.temp }}/record/record

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign the platform manifest (keyless)
        env:
          MANIFEST: ${{ steps.build.outputs.manifest }}
        run: timeout 300 cosign sign --yes "${IMAGE}@${MANIFEST}"

      - name: Generate the platform SBOM (syft, SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.manifest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          syft-version: ${{ env.SYFT_VERSION }}
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM to the platform manifest (cosign)
        env:
          MANIFEST: ${{ steps.build.outputs.manifest }}
        run: |
          timeout 300 cosign attest --yes --type spdxjson \
            --predicate "$RUNNER_TEMP/sbom.spdx.json" "${IMAGE}@${MANIFEST}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: record-${{ matrix.slug }}
          path: ${{ runner.temp }}/record
          if-no-files-found: error

  assemble:
    name: assemble
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push the index and its tag; the index signature
      id-token: write # cosign keyless (OIDC)
    outputs:
      index: ${{ steps.assemble.outputs.index }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: record-*
          path: ${{ runner.temp }}/records

      - name: Assemble and tag the index
        id: assemble
        uses: ./.github/actions/assemble-index
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ steps.ver.outputs.version }}
          records: ${{ runner.temp }}/records/record-*/record

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign the index (keyless)
        env:
          INDEX: ${{ steps.assemble.outputs.index }}
        run: timeout 300 cosign sign --yes "${IMAGE}@${INDEX}"

      - name: Emit release identity
        env:
          INDEX: ${{ steps.assemble.outputs.index }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          {
            echo "## GORA release artifact"
            echo ""
            echo "- image:  \`${IMAGE}:${VERSION}\`"
            echo "- index digest (the release identity): \`${INDEX}\`"
            for record in "$RUNNER_TEMP"/records/record-*/record; do
              echo "- \`$(sed -n 's/^platform=//p' "$record")\`: \`$(sed -n 's/^manifest=//p' "$record")\`"
            done
            echo ""
            echo "Next — operator / agent records and promotes (Git = source of truth):"
            echo '```bash'
            echo "gora cut-rc --image ${IMAGE} --version ${VERSION} --digest ${INDEX}"
            echo "gora promote dev"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Independently verify the published artifact from its index digest alone (TESTING rule 5):
  # every platform manifest in the index must carry its signature, its SBOM attestation and
  # its provenance, and the index its signature, before the release is considered
  # trustworthy. Runs on the pushed index, not on build state.
  verify:
    name: verify
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      INDEX: ${{ needs.assemble.outputs.index }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.2
          cache-binary: false
          driver: docker

      - name: List the platform manifests in the index
        id: list
        run: |
          raw=$(timeout 120 docker buildx imagetools inspect --raw "${IMAGE}@${INDEX}")
          rows=$(printf '%s' "$raw" | jq -r '.manifests[]
            | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")
            | "\(.platform.os)/\(.platform.architecture) \(.digest)"' | sort)
          printf '%s\n' "$rows"
          if [ "$(printf '%s\n' "$rows" | cut -d' ' -f1 | tr '\n' ' ')" != "linux/amd64 linux/arm64 " ]; then
            echo "::error::the index does not hold exactly linux/amd64 and linux/arm64"
            exit 1
          fi
          echo "manifests=$(printf '%s\n' "$rows" | cut -d' ' -f2 | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Verify signatures (index and every platform manifest)
        env:
          MANIFESTS: ${{ steps.list.outputs.manifests }}
        run: |
          for digest in "$INDEX" $MANIFESTS; do
            echo "signature: ${IMAGE}@${digest}"
            timeout 120 cosign verify "${IMAGE}@${digest}" \
              --certificate-oidc-issuer="$ISSUER" --certificate-identity-regexp="$SIGNER" > /dev/null
          done

      - name: Verify SBOM attestations (every platform manifest)
        env:
          MANIFESTS: ${{ steps.list.outputs.manifests }}
        run: |
          for digest in $MANIFESTS; do
            echo "SBOM: ${IMAGE}@${digest}"
            timeout 120 cosign verify-attestation --type spdxjson "${IMAGE}@${digest}" \
              --certificate-oidc-issuer="$ISSUER" --certificate-identity-regexp="$SIGNER" > /dev/null
          done

      - name: Inspect provenance (every platform)
        run: |
          timeout 120 docker buildx imagetools inspect "${IMAGE}@${INDEX}" --format '{{ json .Provenance }}' \
            > "$RUNNER_TEMP/provenance.json"
          for platform in linux/amd64 linux/arm64; do
            echo "provenance: $platform"
            jq -e --arg p "$platform" '.[$p].SLSA != null and .[$p].SLSA != {}' \
              "$RUNNER_TEMP/provenance.json" > /dev/null
          done
