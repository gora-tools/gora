name: Release

# Builds, signs, and publishes the GORA release artifact on a version tag.
# See ADR-011 (self-release pipeline): a signed OCI artifact = image + SBOM + provenance.
# CI does NOT mutate the manifest — an operator/agent runs `gora cut-rc` + `gora promote`
# with the digest this workflow emits (ADR-007: no premature automation; that is M4).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write # push image to GHCR
  id-token: write # cosign keyless (OIDC)

env:
  IMAGE: ghcr.io/zuwarskejes-labs/gora
  # cosign-installer v4 installs cosign v3 by default; the evidence stays cosign v2's until
  # ADR-018 is implemented. Updated by hand: Dependabot does not read action inputs.
  COSIGN_VERSION: v2.6.5

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deployments/docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
          provenance: mode=max # SLSA provenance as an OCI attestation in the registry

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate SBOM (syft, SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM (cosign)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"

      - name: Emit release identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          {
            echo "## GORA release artifact"
            echo ""
            echo "- image:  \`${IMAGE}:${VERSION}\`"
            echo "- digest: \`${DIGEST}\`"
            echo ""
            echo "Next — operator / agent records and promotes (Git = source of truth):"
            echo '```bash'
            echo "gora cut-rc --image ${IMAGE} --version ${VERSION} --digest ${DIGEST}"
            echo "gora promote dev"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Independently verify the published artifact from its digest alone (standard #5):
  # signature, SBOM attestation, and provenance must all check out before the release
  # is considered trustworthy. Runs on the pushed image, not on local build state.
  verify:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      DIGEST: ${{ needs.release.outputs.digest }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Verify signature
        run: |
          timeout 120 cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity-regexp='^https://github.com/zuwarskejes-labs/gora/\.github/workflows/release\.yml@' \
            > /dev/null
      - name: Verify SBOM attestation
        run: |
          timeout 120 cosign verify-attestation --type spdxjson "${IMAGE}@${DIGEST}" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity-regexp='^https://github.com/zuwarskejes-labs/gora/\.github/workflows/release\.yml@' \
            > /dev/null
      - name: Inspect provenance
        run: |
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{ json .Provenance }}' \
            | jq -e '. != null and . != {}' > /dev/null
