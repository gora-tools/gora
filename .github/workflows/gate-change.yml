name: Gate change

# ADR-0016 rule 7: a PR that touches a gate-defining file, or removes or switches off a
# test, is reviewed as a gate change.
# pull_request_target runs this file as it is on the base branch, so a PR cannot edit the
# check that judges it. It never checks out or runs code from the PR: it reads the PR's
# file list and patches through the API, and nothing else.
#
# The result is the commit status `gate-change` on the PR's head commit, which a ruleset can
# require. A gate change is approved only by the act of adding the label
# gate-change-reviewed while the event's head is the PR's head. A label the PR already
# carries approves nothing: opened, reopened and synchronize remove it and judge the head
# unreviewed. Removing the label is a failure. Any other label event posts nothing, so the
# status on the head stays as it was.
#
# The concurrency group keeps runs in event order. A run still pending when a newer event
# arrives is replaced, so its event is never judged: if a synchronize run is replaced, the
# label is not removed and the new head gets no status, or a failure. Both are fail-closed:
# the head has no passing status until someone adds the label again (removing it first, if
# it is still there). The `classify` step is unit-tested from this file by
# tests/unit/test_gate_change.py.
#
# The status is the only commit context called `gate-change`. The job's check run carries
# another name on purpose: an event for another label posts no status and the job succeeds,
# so a green check run named `gate-change` would sit on a head whose status is failure.
# tests/unit/test_gate_change.py fails if a workflow, job or step takes that name.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  pull-requests: write
  statuses: write
  contents: read

concurrency:
  group: gate-change-${{ github.event.pull_request.number }}

jobs:
  classifier:
    name: gate-change classifier
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Classify and post the status
        id: classify
        shell: python
        # Everything from the event reaches the script as data in the environment.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_LABEL: ${{ github.event.label.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          """Is this PR a gate change? The answer is posted as the commit status
          `gate-change` on the head commit the event names.

          The snapshot is the event payload: its action, its head SHA and, for a label
          event, the label it adds or removes. The PR's label set is never read as approval.
          Nothing from the PR is executed, and every value reaches gh as one item of an
          argument list, never through a shell.
          """

          import json
          import os
          import re
          import subprocess
          import sys
          from collections import Counter
          from fnmatch import fnmatchcase
          from typing import NamedTuple

          LABEL = "gate-change-reviewed"
          CONTEXT = "gate-change"
          COMMIT_SHA = re.compile(r"[0-9a-f]{40}")

          PENDING = "checking gate files"
          NOT_GATE = "no gate files changed"
          REVIEWED = f"gate files changed, reviewed (label {LABEL})"
          UNREVIEWED = f"gate files changed: review, then add label {LABEL}"
          UNCLASSIFIED = "gate-change could not classify the files"
          NOT_OURS = "not a gate-change event"
          # Events that start a review over: the label a PR carries into them is removed.
          RESETS = frozenset({"opened", "reopened", "synchronize"})

          # Gate-defining paths (ADR-0016 rule 7), plus the files that can override one of
          # them or change what a gate sees: pytest, ruff, mypy and uv also read these names,
          # ruff skips what a .gitignore or an .ignore names, git archive, the export every
          # gate runs on, drops what .gitattributes marks and rewrites what it sets, a
          # dockerignore cuts the build context (the root one, or <Dockerfile>.dockerignore
          # beside a Dockerfile), and make reads GNUmakefile and makefile before Makefile.
          GATE_PREFIXES = (".github/workflows/", ".github/actions/", "scripts/gate/")
          GATE_SUFFIXES = (".dockerignore",)
          GATE_FILES = frozenset(
              {
                  "Makefile",
                  "GNUmakefile",
                  "makefile",
                  "uv.lock",
                  ".python-version",
                  "deployments/docker/Dockerfile",
                  "deployments/docker/gate-images.Dockerfile",
                  "deployments/docker/debian.sources",
                  "deployments/docker/debian.lock",
              }
          )
          GATE_NAMES = frozenset(
              {
                  "pyproject.toml",
                  "conftest.py",
                  "pytest.ini",
                  "pytest.toml",
                  ".pytest.ini",
                  ".pytest.toml",
                  "tox.ini",
                  "setup.cfg",
                  "ruff.toml",
                  ".ruff.toml",
                  "mypy.ini",
                  ".mypy.ini",
                  "uv.toml",
                  ".gitignore",
                  ".ignore",
                  ".gitattributes",
              }
          )
          # An inline suppression of a gate's tool, in any case and spacing: wider than what
          # ruff, mypy, shellcheck and the formatter accept (ADR-016, Enforcement), so a false
          # positive asks for a review and nothing the tools read slips through. ruff's own
          # forms are its range and line comments (ignore, disable, enable) and the isort
          # actions that switch a block or a file off.
          SUPPRESSION = re.compile(
              r"#\s*(?:(?:ruff|flake8)\s*:\s*)?noqa\b"
              r"|#\s*type\s*:\s*ignore\b"
              r"|#\s*mypy\s*:"
              r"|#\s*shellcheck\s[^#\n]*\bdisable\s*="
              r"|#\s*(?:fmt|yapf)\s*:\s*(?:off|skip|disable)\b"
              r"|#\s*ruff\s*:\s*(?:ignore|disable|enable)\b"
              r"|#\s*(?:ruff\s*:\s*)?isort\s*:\s*(?:skip_file|skip|off)\b",
              re.IGNORECASE,
          )
          HUNK = re.compile(r"^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@")

          # A test removed or switched off, under tests/ (ADR-016 rule 7). The names are
          # pytest's own, each measured on the pinned version by tests/unit/test_gate_change.py:
          # the modules it collects (its python_files default; pyproject.toml sets none, and
          # a change to that setting is a gate path) and the directories it does not enter
          # (its norecursedirs default).
          TESTS_DIR = "tests/"
          TEST_MODULES = ("test_*.py", "*_test.py")
          NOT_ENTERED = (
              "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}"
          )
          # A line that defines what pytest collects: a function or method whose name starts
          # with test, a class whose name starts with Test. The name is group 1 or group 2.
          TEST_DEFINITION = re.compile(r"\s*(?:(?:async\s+)?def\s+(test\w*)|class\s+(Test\w*))")
          # Every spelling the pinned pytest honours for a test it does not run, or runs and
          # does not count, or does not collect, or a run it ends: pytest's markers and calls,
          # a module or class pytestmark, __test__, the unittest ones, and the imports and
          # aliases that rename them. Wider than the tool where that is cheap (a skipif that
          # never skips): a false match asks for a review. A name bound elsewhere (an assignment,
          # getattr, a helper in another module) is read only where it is spelled.
          SWITCH_OFF = re.compile(
              r"\bmark\s*\.\s*(?:skip|skipif|xfail)\b"
              r"|\bpytest\s*\.\s*(?:skip|xfail|importorskip|exit)\b"
              r"|\bpytestmark\b"
              r"|\b__test__\s*=(?!=)"
              r"|\bunittest\s*\.\s*(?:skip|skipIf|skipUnless|expectedFailure|SkipTest)\b"
              r"|\bskipTest\s*\("
              r"|^\s*import\s+pytest\s+as\b"
              r"|^\s*from\s+pytest\s+import\b[^#\n]*\b(?:as|skip|xfail|importorskip|exit)\b"
              r"|^\s*from\s+unittest\s+import\b[^#\n]*"
              r"\b(?:skip|skipIf|skipUnless|expectedFailure|SkipTest)\b"
          )


          class Decision(NamedTuple):
              post: bool  # post a status on the payload's head, or post nothing
              state: str  # pending, success, failure, error; superseded or skipped: no post
              description: str


          def is_gate_path(path):
              return (
                  path.startswith(GATE_PREFIXES)
                  or path in GATE_FILES
                  or path.rsplit("/", 1)[-1] in GATE_NAMES
                  or path.endswith(GATE_SUFFIXES)
              )


          def gate_paths(files):
              """Gate-defining paths the PR touches; a rename counts under both names."""
              paths = set()
              for f in files:
                  if not isinstance(f.get("filename"), str):
                      raise ValueError("a changed file without a filename")
                  for path in (f["filename"], f.get("previous_filename")):
                      if path and is_gate_path(path):
                          paths.add(path)
              return sorted(paths)


          def changed_lines(patch):
              """``(sign, line, text)`` for each added (+) and removed (-) line of a patch; the
              line is its number in the new file for an added line, in the old for a removed."""
              old = new = 0
              for text in patch.split("\n"):
                  hunk = HUNK.match(text)
                  if hunk:
                      old, new = int(hunk.group(1)), int(hunk.group(2))
                  elif text.startswith("+"):
                      yield "+", new, text[1:]
                      new += 1
                  elif text.startswith("-"):
                      yield "-", old, text[1:]
                      old += 1
                  elif not text.startswith("\\"):
                      old += 1
                      new += 1


          def suppressions(files):
              """``path:line: text`` for each added line carrying an inline suppression."""
              found = []
              for f in files:
                  patch = f.get("patch")
                  if patch is None:
                      if f.get("additions", 0):
                          found.append(f"{f['filename']}: no patch from the API, added lines unread")
                      continue
                  for sign, line, text in changed_lines(patch):
                      if sign == "+" and SUPPRESSION.search(text):
                          found.append(f"{f['filename']}:{line}: {text.strip()[:120]}")
              return found


          def is_test_module(path):
              """True when pytest, run on tests/, collects the module at ``path``."""
              *dirs, name = path.split("/")
              if not path.startswith(TESTS_DIR):
                  return False
              if any(fnmatchcase(d, p) for d in dirs[1:] for p in NOT_ENTERED):
                  return False
              return any(fnmatchcase(name, p) for p in TEST_MODULES)


          def defined_test(text):
              """The name of the test a line defines, or None."""
              match = TEST_DEFINITION.match(text)
              return match and (match[1] or match[2])


          def weakened_tests(files):
              """``path[:line]: reason`` for each test a PR removes or switches off, under
              tests/: a module removed, or renamed so that pytest no longer collects it (a
              rename is read under both names); a test definition removed, that is, a line
              defining a name the same file does not gain a line defining again (a signature
              edit keeps its name; a move to another file does not); a line that skips,
              expects failure or ends the run added."""
              found = []
              for f in files:
                  name, old, patch = f["filename"], f.get("previous_filename"), f.get("patch")
                  if f.get("status") == "removed" and is_test_module(name):
                      found.append(f"{name}: test module removed")
                  elif old and is_test_module(old) and not is_test_module(name):
                      found.append(f"{old} -> {name}: test module no longer collected by pytest")
                  elif not name.startswith(TESTS_DIR):
                      continue
                  elif patch is None:
                      if f.get("deletions", 0):
                          found.append(f"{name}: no patch from the API, removed lines unread")
                  elif name.endswith(".py"):
                      lines = [(*c, defined_test(c[2])) for c in changed_lines(patch)]
                      regained = Counter(d for sign, _, _, d in lines if sign == "+" and d)
                      for sign, line, text, defined in lines:
                          shown = text.strip()[:120]
                          if sign == "-" and defined:
                              if regained[defined]:
                                  regained[defined] -= 1
                              else:
                                  found.append(f"{name}:{line}: test definition removed: {shown}")
                          elif sign == "+" and SWITCH_OFF.search(text):
                              found.append(f"{name}:{line}: test skipped or switched off: {shown}")
              return found


          def snapshot(payload_sha, live_sha):
              """None when this run may judge the payload's head; else the decision ending it."""
              if not isinstance(payload_sha, str) or not COMMIT_SHA.fullmatch(payload_sha):
                  return Decision(False, "error", "the event's head is not a commit SHA")
              if not isinstance(live_sha, str) or not COMMIT_SHA.fullmatch(live_sha):
                  return Decision(True, "error", UNCLASSIFIED)
              if live_sha != payload_sha:
                  return Decision(False, "superseded", f"superseded by {live_sha}")
              return None


          def judges(action, event_label):
              """False for an event that adds or removes another label: it judges nothing."""
              return action not in ("labeled", "unlabeled") or event_label == LABEL


          def decide(action, event_label, payload_sha, live_sha, files):
              """The status for the payload's head. ``files`` is None when it could not be
              read. Only the event that adds the label approves a gate change."""
              if not judges(action, event_label):
                  return Decision(False, "skipped", NOT_OURS)
              ended = snapshot(payload_sha, live_sha)
              if ended is not None:
                  return ended
              if files is None:
                  return Decision(True, "error", UNCLASSIFIED)
              try:
                  changed = gate_paths(files) or suppressions(files) or weakened_tests(files)
              except (KeyError, TypeError, AttributeError, ValueError):
                  return Decision(True, "error", UNCLASSIFIED)
              if not changed:
                  return Decision(True, "success", NOT_GATE)
              if action == "labeled" and event_label == LABEL:
                  return Decision(True, "success", REVIEWED)
              return Decision(True, "failure", UNREVIEWED)


          def details(files):
              """Markdown naming the gate paths, suppression lines and weakened tests, for the
              step summary."""
              try:
                  paths, lines = gate_paths(files), suppressions(files)
                  tests = weakened_tests(files)
              except (KeyError, TypeError, AttributeError, ValueError):
                  return []
              body = []
              if paths:
                  body += ["Gate-defining paths:", ""] + [f"- `{p}`" for p in paths] + [""]
              if lines:
                  shown = [s.replace("`", "'") for s in lines]
                  body += ["Added lines with an inline suppression:", "", "```text"]
                  body += shown + ["```", ""]
              if tests:
                  shown = [s.replace("`", "'") for s in tests]
                  body += ["Tests removed, skipped or switched off:", "", "```text"]
                  body += shown + ["```", ""]
              return body


          def gh(*args):
              """``gh api`` with one argument list; no shell sees any value."""
              done = subprocess.run(["gh", "api", *args], capture_output=True, text=True)
              if done.returncode != 0:
                  raise RuntimeError(f"gh api {args[0]} failed: {done.stderr.strip()[:300]}")
              return done.stdout


          def post(repo, sha, decision, url):
              gh(
                  f"repos/{repo}/statuses/{sha}",
                  "-f", f"state={decision.state}",
                  "-f", f"context={CONTEXT}",
                  "-f", f"description={decision.description}",
                  "-f", f"target_url={url}",
              )


          def main():
              env = os.environ
              repo, pr, action, sha = env["REPO"], env["PR"], env["ACTION"], env["HEAD_SHA"]
              url, event_label = env["RUN_URL"], env.get("EVENT_LABEL", "")
              notes, live, files = [], None, None
              # Another label's event judges nothing: no API call, no status.
              ours = judges(action, event_label)
              try:
                  if not pr.isdigit():
                      raise RuntimeError("the event's PR number is not a number")
                  if ours:
                      if action in RESETS:
                          labels = gh(f"repos/{repo}/issues/{pr}/labels", "--jq", ".[].name")
                          if LABEL in labels.splitlines():
                              gh("-X", "DELETE", f"repos/{repo}/issues/{pr}/labels/{LABEL}")
                              notes.append(f"Removed `{LABEL}`: this head is not reviewed.")
                      live = gh(f"repos/{repo}/pulls/{pr}", "--jq", ".head.sha").strip()
                      if snapshot(sha, live) is None:
                          post(repo, sha, Decision(True, "pending", PENDING), url)
                          rows = gh(
                              f"repos/{repo}/pulls/{pr}/files?per_page=100",
                              "--paginate", "--jq", ".[] | @json",
                          )
                          files = [json.loads(r) for r in rows.splitlines() if r.strip()]
              except (RuntimeError, ValueError) as exc:
                  notes.append(f"Could not read the PR: {exc}")
              decision = decide(action, event_label, sha, live, files)
              summary = ["## Gate change (ADR-0016 rule 7)", ""]
              summary += [f"**{decision.state}**: {decision.description}", ""] + notes + [""]
              if files is not None:
                  summary += details(files)
              status = 0 if decision.state in ("success", "superseded", "skipped") else 1
              if decision.post:
                  try:
                      post(repo, sha, decision, url)
                  except RuntimeError as exc:
                      summary.append(f"Could not post the status: {exc}")
                      status = 1
              text = "\n".join(summary)
              print(text)
              with open(env["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
                  fh.write(text + "\n")
              return status


          if __name__ == "__main__":
              sys.exit(main())
