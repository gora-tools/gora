name: Candidate

# Gate-defining file (ADR-0016 rule 7). On every push to main it asks GORA which artifacts the
# pushed commit is a candidate of (`gora changes`, ADR-022 section 4, ADR-026 section 9), as
# GORA's own GitHub App: the job `changes` mints the App's installation token, narrowed to
# read, and hands it to that one command as GORA_GITHUB_TOKEN (ADR-022 section 14). It builds,
# signs and pushes nothing, so it leaves no digest in GHCR. A person may start it from main with
# workflow_dispatch; a pull request never does, since a pull request holds no secret and must
# never reach the environment `gora`.
#
# Why a job of this caller and not of build.yml: build.yml is the reusable workflow a project
# calls and the builder identity release-policy.yaml names, and the App's key must stay out of
# its jobs. The token's source is the one thing GORA cannot check, since the core passes any
# installation token (ADR-006, the note on the reader's token); this file is where it is
# decided: its job `changes` is the only one that mints the App's token, and
# tests/unit/test_candidate.py holds that the token reaches the command from the step that
# mints it, and from nowhere else.
#
# The risk this accepts: the App's private key can create version and state tags and write
# gora/* branches, and every step of the job `changes` can read it, because the runner holds
# every secret a job references for the whole job. The order of the steps changes none of
# that: the token is minted last before its use only to shorten its life. What the job runs is
# the code of a commit already on main, its dependencies locked by hash in uv.lock, three
# third-party actions pinned by commit, and an environment that only main reaches. The risk ends
# when the key moves to a signer and the job holds none (ADR-023 section 11).
#
# The job never uses the token of Actions: no `github.token`, no `secrets.GITHUB_TOKEN`.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; the job `changes` asks for what it needs.
permissions: {}

jobs:
  # The first job of the run. It checks out nothing and holds no permission: it reads the ref the
  # run was started on and nothing else. tests/unit/test_candidate.py runs it from this file.
  guard:
    name: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse any ref but main
        id: guard
        shell: bash
        run: |
          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "::error::${GITHUB_REF:-(no ref)} is not refs/heads/main." \
              "GORA asks which artifacts a commit is a candidate of on main and nowhere else."
            exit 1
          fi
          echo "asking about the head of ${GITHUB_REF}"

  changes:
    name: changes
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The one job of this file with an environment: the App's variable and key are its.
    environment: gora
    permissions:
      contents: read
    outputs:
      body: ${{ steps.ask.outputs.body }}
    steps:
      # The whole history, as the Git adapter reads it: no shallow clone, no filter, and no
      # credential left in the clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The exact uv and Python the release image is built with, both declared in its
      # Dockerfile. shell: bash is pipefail: versions.sh exiting 2 fails the
      # step, where the default shell ends the pipe with tee's 0 and the outputs stay empty.
      - name: Read the exact uv and Python
        id: versions
        shell: bash
        run: scripts/gate/versions.sh | tee -a "$GITHUB_OUTPUT"

      - name: Install uv, and select that Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ steps.versions.outputs.uv }}
          python-version: ${{ steps.versions.outputs.python }}
          enable-cache: false

      # uv.lock exactly, the test group and the build backend (TESTING rule 3).
      - name: Install the locked environment
        run: make sync-test

      # GORA's App, narrowed to read, for the one repository. Minted last before its use.
      - name: Make the App's installation token
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.GORA_APP_ID }}
          private-key: ${{ secrets.GORA_APP_PRIVATE_KEY }}
          owner: gora-tools
          repositories: gora
          permission-contents: read
          permission-metadata: read

      # GORA_PROJECT is a literal: ${{ github.repository }} has no host and keeps the host's
      # case (README, "Configuration"). Every value reaches the script through env.
      - name: Ask which artifacts the commit is a candidate of
        id: ask
        shell: bash
        env:
          GORA_PROJECT: github.com/gora-tools/gora
          GORA_GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          COMMIT: ${{ github.sha }}
        run: |
          body=$(uv run --no-sync gora changes --output json "$COMMIT")
          echo "body=$body" >> "$GITHUB_OUTPUT"
          echo "$body"
