name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format check
        run: uv run ruff format --check src/ tests/

      - name: Type check
        run: uv run mypy src/gora/

      - name: Test
        run: uv run pytest --tb=short -v

      # Build the release image from tracked files only, so a broken/undeclared
      # build dependency (e.g. an un-committed lockfile) fails here on every PR —
      # not silently at release time. See `make docker-smoke`.
      - name: Docker smoke (release image builds + CLI boots)
        run: make docker-smoke
