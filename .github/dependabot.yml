# The update path of every pinned build input (ADR-021; TESTING rule 3). Dependabot opens
# pull requests only; a human reviews and merges each one, and every one that touches a
# gate-defining file is a gate change (ADR-0016 rule 7).
#
# Exact versions are declared once, where results are produced (TESTING rule 3):
# - uv: the uv stage of deployments/docker/Dockerfile and the linux-gate image of
#   deployments/docker/gate-images.Dockerfile move together (one group below), or
#   tests/unit/test_build_pins.py fails. pyproject.toml's required-version is a floor for
#   developers and does not move with them.
# - Python: a bump of the python:3.12-slim-trixie digest in deployments/docker/base.Dockerfile
#   to a new patch fails the build of the base, which checks its interpreter against ARG
#   PYTHON_VERSION, when a person runs base.yml; no check of a pull request builds the base.
#   The reviewer sets ARG PYTHON_VERSION in that file to the new patch in the same pull
#   request. The release image ships the Python of the base digest it names, declared beside
#   it as ARG BASE_PYTHON_VERSION in deployments/docker/Dockerfile, which CI installs with the
#   pinned uv: the pull request that moves that digest moves the declaration, and if that uv
#   cannot install the patch, CI fails visibly there, and the uv pin is bumped in the same
#   pull request. The release image has no Python base of its own.
# - GORA's base image: the release image starts FROM ghcr.io/gora-tools/gora-base by a digest
#   with no tag, and Dependabot does not touch it (the ignore below). A base bump is applied by
#   running .github/workflows/base.yml on main and moving that digest in a pull request by
#   hand; nothing automates that yet.
# - GORA's scanner image: Grype's image in deployments/docker/scanner.Dockerfile is pinned by tag
#   and digest, and Dependabot proposes the new digest. Such a bump is applied by running
#   .github/workflows/scanner.yml on main, which builds the image with the database of that day,
#   and moving the digest a gate names by hand, as for the base; nothing automates that yet.
# - Python packages: one pull request a week (one group below). Each floor in pyproject.toml
#   rises with it: a floor is the lowest version proven, the one uv.lock carries and CI runs
#   (ADR-021 amendment).
# - Debian packages of the base image: no ecosystem here reads them;
#   deployments/docker/debian.sources, debian.lock and GIT_VERSION move by hand
#   (TESTING rule 3).
version: 2
updates:
  - package-ecosystem: github-actions
    # The workflows, and the actions they share.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker
    # The uv stage of the release image (Dockerfile), the Python base of GORA's own base image
    # (base.Dockerfile), Grype's image under GORA's scanner (scanner.Dockerfile) and the images
    # the gates run (gate-images.Dockerfile), each pinned by digest.
    directory: /deployments/docker
    schedule:
      interval: weekly
    groups:
      uv:
        patterns:
          - "*astral-sh/uv*"
    ignore:
      # GORA's own base image is named by a digest alone, which only a person moves, after
      # running base.yml: no update of it, of any type.
      - dependency-name: ghcr.io/gora-tools/gora-base
      # Python's minor version is a decision (.python-version, the suite's guard), not an
      # update, and so is the Debian release in its tag: only the digest of
      # python:3.12-slim-trixie and its patch version move here.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-packages:
        patterns:
          - "*"
    versioning-strategy: increase
    commit-message:
      prefix: build
      include: scope
